<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>skribbl.io - Free Multiplayer Drawing &amp; Guessing Game</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" type="text/css" href="css/style.css">
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
  <style>
    /* Отключение рекламы и подгонка элементов */
    .ad-1, .ad-2, .ad-side, #preroll { display: none !important; }
    
    /* Скрываем ненужные блоки приватных комнат, оставляем одну прямую кнопку Play! */
    .button-create { display: none !important; }
    
    /* Инвайт блок */
    #custom-invite-bar {
      display: flex;
      gap: 6px;
      margin-top: 10px;
    }
    #custom-invite-bar input {
      flex: 1;
      font-size: 13px;
      padding: 6px;
      border: 1px solid #aaa;
      border-radius: 3px;
      text-transform: uppercase;
      font-weight: bold;
    }
    .btn-flat {
      cursor: pointer;
      font-weight: bold;
      border: none;
      border-radius: 3px;
      padding: 8px 14px;
      color: white;
      background: #53759e;
    }
    .btn-flat:hover { background: #3c577a; }

    /* Окно выбора слова */
    #game-word-picker-custom {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 12px;
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.65);
      z-index: 50;
    }
    #game-word-picker-custom .picker-card {
      background: white;
      padding: 24px 32px;
      border-radius: 8px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.4);
    }
    #game-word-picker-custom h2 {
      margin-bottom: 16px;
      color: #333;
      font-size: 20px;
    }
    .custom-word-options {
      display: flex;
      gap: 12px;
    }
    .custom-word-options button {
      background: #53759e;
      color: white;
      font-size: 16px;
      font-weight: bold;
      border: none;
      border-radius: 4px;
      padding: 12px 20px;
      cursor: pointer;
      transition: 0.15s;
    }
    .custom-word-options button:hover {
      background: #2b4461;
      transform: translateY(-2px);
    }
    .hidden { display: none !important; }

    /* Тулбар палитры */
    .color-swatch {
      width: 22px;
      height: 22px;
      border-radius: 2px;
      cursor: pointer;
      border: 1px solid rgba(0,0,0,0.15);
      transition: transform 0.1s;
    }
    .color-swatch:hover {
      transform: scale(1.15);
    }
    .color-swatch.active {
      outline: 2px solid #000;
      outline-offset: 1px;
    }
    .size-dot-btn {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      background: white;
      border: 1px solid #ccc;
      border-radius: 3px;
    }
    .size-dot-btn.active {
      border-color: #53759e;
      background: #eef2f7;
    }
    .size-dot-btn span {
      background: #333;
      border-radius: 50%;
      display: block;
    }
  </style>
</head>
<body translate="no">

  <!-- ГЛАВНОЕ МЕНЮ (ОРИГИНАЛ SKRIBBL) -->
  <div id="home">
    <div class="logo-big">
      <a href="javascript:void(0)"><img src="img/logo.gif" alt="skribbl.io"></a>
      <div class="avatar-container"></div>
    </div>

    <div class="panels">
      <div class="panel-left"></div>

      <div class="panel">
        <div class="container-name-lang">
          <input class="input-name" id="input-username" type="text" placeholder="Enter your name" maxlength="16" autocomplete="off">
        </div>

        <!-- ОРИГИНАЛЬНЫЙ АВАТАР КАСТОМАЙЗЕР SKRIBBL.IO -->
        <div class="avatar-customizer">
          <div class="arrows left">
            <div class="arrow left" data-avatar-index="1"></div>
            <div class="arrow left" data-avatar-index="2"></div>
            <div class="arrow left" data-avatar-index="0"></div>
          </div>
          <div class="container" id="customizer-avatar-container">
            <!-- Сюда скриптом монтируется оригинальный аватар со спрайтами -->
          </div>
          <div class="arrows right">
            <div class="arrow right" data-avatar-index="1"></div>
            <div class="arrow right" data-avatar-index="2"></div>
            <div class="arrow right" data-avatar-index="0"></div>
          </div>
          <div class="randomize" id="btn-randomize-avatar" title="Случайный аватар"></div>
        </div>

        <!-- КНОПКА PLAY (БЕЗ ПРИВАТНЫХ КОМНАТ) -->
        <button class="button-play" id="btn-play-action">
          <span data-translate="text">Play!</span>
        </button>

        <!-- Быстрый ввод кода, если заходишь к другу -->
        <div id="custom-invite-bar">
          <input type="text" id="input-direct-code" placeholder="Код комнаты друга..." autocomplete="off">
          <button class="btn-flat" id="btn-join-direct">Войти</button>
        </div>
      </div>

      <div class="panel-right"></div>
    </div>
  </div>

  <!-- ИГРОВОЙ ЭКРАН (1 В 1 ОРИГИНАЛЬНЫЙ DOM SKRIBBL) -->
  <div id="game" style="display:none">
    <div id="game-wrapper">
      
      <div id="game-logo">
        <a href="javascript:void(0)"><img src="img/logo.gif" alt="skribbl.io"></a>
      </div>

      <div id="game-bar">
        <div id="game-settings" title="Ссылка для друзей" style="cursor:pointer;">
          <div class="icon"></div>
        </div>
        <div id="game-clock">
          <div class="text" id="game-timer-display">60</div>
        </div>
        <div id="game-round">
          <div class="text" id="game-round-display">Round 1 of 3</div>
        </div>
        <div id="game-word">
          <div class="description" id="game-word-label">WAITING...</div>
          <div class="word" id="game-word-current">_ _ _ _</div>
          <div class="hints"><div class="container"></div></div>
        </div>
      </div>

      <!-- Игроки слева со спрайтами скинов -->
      <div id="game-players">
        <div class="players-list" id="game-players-list"></div>
      </div>

      <div id="game-players-footer"></div>

      <!-- Холст рисования -->
      <div id="game-canvas">
        <canvas id="main-draw-canvas" width="800" height="600"></canvas>
        <div class="overlay" id="canvas-overlay" style="display:none;"></div>
        
        <!-- Выбор слова -->
        <div id="game-word-picker-custom" class="hidden">
          <div class="picker-card">
            <h2>Choose a word</h2>
            <div class="custom-word-options" id="word-options-container"></div>
          </div>
        </div>

        <!-- Окно лобби / ожидания перед стартом игры -->
        <div class="room" id="game-lobby-waiting-room" style="display:flex; flex-direction:column; align-items:center; justify-content:center; position:absolute; inset:0; background:rgba(255,255,255,0.95); z-index:40;">
          <h2 style="margin-bottom:12px; font-size:24px; color:#333;">Комната готова!</h2>
          <p style="margin-bottom:20px; color:#666;">Поделитесь кодом комнаты с друзьями:</p>
          <div id="game-invite" style="margin-bottom:20px;">
            <div class="input-container">
              <input type="text" readonly id="share-link-input">
            </div>
            <button id="btn-copy-share-link"><span>Copy</span></button>
          </div>
          <button id="btn-start-match" class="btn-flat" style="padding:14px 32px; font-size:18px; display:none;">Начать игру ▶</button>
        </div>
      </div>

      <!-- Тулбар с инструментами и цветами -->
      <div id="game-toolbar">
        <div class="toolbar-group-tools" style="display:flex; gap:6px; align-items:center;">
          <button id="btn-tool-pen" class="btn-flat" style="padding:6px 10px; font-size:12px;">✏️ Pen</button>
          <button id="btn-tool-eraser" class="btn-flat" style="padding:6px 10px; font-size:12px; background:#78909c;">🧹 Eraser</button>
          <button id="btn-tool-clear" class="btn-flat" style="padding:6px 10px; font-size:12px; background:#e53935;">🗑 Clear</button>
        </div>

        <!-- Размеры кисти -->
        <div class="sizes" style="display:flex; gap:4px; align-items:center; margin: 0 10px;">
          <div class="size-dot-btn active" data-size="3"><span style="width:4px; height:4px;"></span></div>
          <div class="size-dot-btn" data-size="6"><span style="width:8px; height:8px;"></span></div>
          <div class="size-dot-btn" data-size="12"><span style="width:14px; height:14px;"></span></div>
          <div class="size-dot-btn" data-size="24"><span style="width:20px; height:20px;"></span></div>
        </div>

        <!-- Палитра оригинальных цветов skribbl -->
        <div class="colors" style="display:flex; gap:4px; align-items:center;">
          <div class="color-swatch active" data-color="#000000" style="background:#000000;"></div>
          <div class="color-swatch" data-color="#ffffff" style="background:#ffffff;"></div>
          <div class="color-swatch" data-color="#c1c1c1" style="background:#c1c1c1;"></div>
          <div class="color-swatch" data-color="#ef130b" style="background:#ef130b;"></div>
          <div class="color-swatch" data-color="#ff7100" style="background:#ff7100;"></div>
          <div class="color-swatch" data-color="#ffe400" style="background:#ffe400;"></div>
          <div class="color-swatch" data-color="#00cc00" style="background:#00cc00;"></div>
          <div class="color-swatch" data-color="#00b2ff" style="background:#00b2ff;"></div>
          <div class="color-swatch" data-color="#231fd3" style="background:#231fd3;"></div>
          <div class="color-swatch" data-color="#a300ba" style="background:#a300ba;"></div>
          <div class="color-swatch" data-color="#d37caa" style="background:#d37caa;"></div>
          <div class="color-swatch" data-color="#a0522d" style="background:#a0522d;"></div>
        </div>
      </div>

      <!-- Чат -->
      <div id="game-chat">
        <div class="chat-content" id="skribbl-chat-messages" style="display:flex; flex-direction:column; gap:6px; padding:10px; overflow-y:auto; flex:1; font-size:13px;">
          <div style="color:#777; font-style:italic;">Welcome to skribbl!</div>
        </div>
        <form class="chat-form" id="skribbl-chat-form">
          <input type="text" id="skribbl-chat-input" placeholder="Type your guess here..." maxlength="100" autocomplete="off">
        </form>
      </div>

    </div>
  </div>

  <script src="words.js"></script>
  <script src="app.js"></script>
</body>
</html>
