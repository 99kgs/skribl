<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <title>skribbl - Рисуй и Угадывай</title>
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link href="main.css" rel="stylesheet">
  <style>
    /* Отключение рекламы и лишних блоков */
    #head-advertice, #header-advertice, #chat-advertice, #preroll, .game-sidebar-actions, .containerPlayerListButtons { display: none !important; }
    
    /* Окно выбора слова */
    #word-select-modal {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 1000;
    }
    #word-select-modal .modal-box {
      background: #ffffff;
      padding: 24px 32px;
      border-radius: 6px;
      text-align: center;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }
    #word-select-modal h3 {
      margin-top: 0;
      margin-bottom: 16px;
      color: #333;
      font-size: 20px;
    }
    .word-select-buttons {
      display: flex;
      gap: 10px;
    }
    .word-btn-opt {
      background: #5cb85c;
      color: white;
      border: none;
      padding: 10px 20px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 4px;
      cursor: pointer;
    }
    .word-btn-opt:hover { background: #4cae4c; }

    .hidden { display: none !important; }

    /* Чат стили */
    #boxMessages {
      overflow-y: auto;
      flex: 1;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
      font-size: 13px;
    }
    .chat-row { padding: 2px 4px; border-radius: 3px; word-break: break-word; }
    .chat-row.system { color: #888; font-style: italic; }
    .chat-row.correct { color: #3c763d; background-color: #dff0d8; font-weight: bold; }
    .chat-row.normal strong { color: #337ab7; }

    /* Позиционирование аватара */
    .avatar .color, .avatar .eyes, .avatar .mouth {
      background-size: 480px 480px;
    }
    #loginAvatar .color, #loginAvatar .eyes, #loginAvatar .mouth {
      background-size: 960px 960px;
    }
  </style>
</head>
<body oncontextmenu="return false;" style="background-color:#245195; margin:0; padding:0;">

  <div class="container-fluid" style="max-width:1400px; padding:0 4px;">
    
    <!-- ШАПКА С ЛОГОТИПОМ -->
    <div class="header">
      <div id="containerLogoBig">
        <a href="javascript:void(0)"><img class="logo logoBig" src="logo.gif" alt="skribbl"></a>
      </div>
    </div>

    <!-- ЭКРАН ВХОДА (ОРИГИНАЛ SKRIBBL.RU) -->
    <div id="screenLogin">
      <div class="login-content">
        <div class="loginPanelContent" style="padding:8px">
          
          <form id="formLogin" onsubmit="return false;">
            <div class="login">
              <input class="form-control" id="inputName" type="text" autocomplete="off" placeholder="Введите ваше имя" maxlength="20">
            </div>

            <!-- АВАТАР КАСТОМАЙЗЕР -->
            <div id="loginAvatarCustomizeContainer">
              <div id="buttonAvatarCustomizerCube" title="Кубик"></div>
              <div id="buttonAvatarCustomizerRandomize" title="Случайно"></div>
              
              <div class="avatarArrows" id="loginAvatarArrowsLeft">
                <div class="avatarArrow avatarArrowLeft" data-avatarindex="1"></div>
                <div class="avatarArrow avatarArrowLeft" data-avatarindex="2"></div>
                <div class="avatarArrow avatarArrowLeft" data-avatarindex="0"></div>
              </div>

              <div class="avatarContainer">
                <div class="avatar avatar-fit" id="loginAvatar">
                  <div class="color"></div>
                  <div class="eyes"></div>
                  <div class="mouth"></div>
                </div>
              </div>

              <div class="avatarArrows" id="loginAvatarArrowsRight">
                <div class="avatarArrow avatarArrowRight" data-avatarindex="1"></div>
                <div class="avatarArrow avatarArrowRight" data-avatarindex="2"></div>
                <div class="avatarArrow avatarArrowRight" data-avatarindex="0"></div>
              </div>
            </div>

            <!-- ЕДИНАЯ КНОПКА ВХОДА -->
            <button class="btn btn-success btn-lg btn-block" id="btnPlayGame" style="margin-top:12px; font-weight:bold; font-size:20px;" type="button">
              Играть!
            </button>
          </form>

        </div>
      </div>
    </div>

    <!-- ИГРОВОЙ ЭКРАН (1 В 1 РАЗМЕТКА SKRIBBL.RU) -->
    <div id="screenGame" style="display:none;">
      
      <div class="gameHeader">
        <div class="timer-container">
          <div id="timer">60</div>
        </div>
        <div id="round">Раунд 1 из 3</div>
        <div id="currentWord">_ _ _ _</div>
      </div>

      <div class="containerGame">
        
        <!-- Список игроков слева -->
        <div id="containerPlayerlist">
          <div id="containerGamePlayers"></div>
        </div>

        <!-- Холст по центру -->
        <div id="containerBoard">
          <div id="containerCanvas" style="position:relative;">
            <canvas id="canvasGame" width="800" height="600" style="background:#ffffff; cursor:crosshair;"></canvas>
            
            <!-- Окно выбора слова -->
            <div id="word-select-modal" class="hidden">
              <div class="modal-box">
                <h3>Выберите слово для рисования:</h3>
                <div class="word-select-buttons" id="word-select-options"></div>
              </div>
            </div>
          </div>
        </div>

        <!-- Тулбар рисования (скрывается у тех, кто угадывает) -->
        <div class="containerToolbar" id="drawingToolbar" style="display:none;">
          <div class="containerToolbar1">
            <div class="colorPreview" id="currentColorPreview" style="background:#000;"></div>
            <div class="containerColorbox">
              <div class="containerColorColumn">
                <div class="colorItem" data-color="#ffffff" style="background:#fff"></div>
                <div class="colorItem" data-color="#c1c1c1" style="background:#c1c1c1"></div>
                <div class="colorItem" data-color="#ef130b" style="background:#ef130b"></div>
                <div class="colorItem" data-color="#ff7100" style="background:#ff7100"></div>
                <div class="colorItem" data-color="#ffe400" style="background:#ffe400"></div>
                <div class="colorItem" data-color="#00cc00" style="background:#0c0"></div>
                <div class="colorItem" data-color="#00b2ff" style="background:#00b2ff"></div>
                <div class="colorItem" data-color="#231fd3" style="background:#231fd3"></div>
                <div class="colorItem" data-color="#a300ba" style="background:#a300ba"></div>
                <div class="colorItem" data-color="#d37caa" style="background:#d37caa"></div>
                <div class="colorItem" data-color="#a0522d" style="background:sienna"></div>
              </div>
              <div class="containerColorColumn">
                <div class="colorItem" data-color="#000000" style="background:#000"></div>
                <div class="colorItem" data-color="#4c4c4c" style="background:#4c4c4c"></div>
                <div class="colorItem" data-color="#740b07" style="background:#740b07"></div>
                <div class="colorItem" data-color="#c23800" style="background:#c23800"></div>
                <div class="colorItem" data-color="#e8a200" style="background:#e8a200"></div>
                <div class="colorItem" data-color="#005510" style="background:#005510"></div>
                <div class="colorItem" data-color="#00569e" style="background:#00569e"></div>
                <div class="colorItem" data-color="#0e0865" style="background:#0e0865"></div>
                <div class="colorItem" data-color="#550069" style="background:#550069"></div>
                <div class="colorItem" data-color="#a75574" style="background:#a75574"></div>
                <div class="colorItem" data-color="#63300d" style="background:#63300d"></div>
              </div>
            </div>
          </div>

          <div class="containerToolbar2">
            <div class="containerTools">
              <div class="tool active" id="toolBtnPen"><img class="toolIcon" src="pen.gif" title="Кисть"></div>
              <div class="tool" id="toolBtnEraser"><img class="toolIcon" src="rubber.gif" title="Ластик"></div>
            </div>

            <div class="containerBrushSizes">
              <div class="brushSize active" data-size="3"><div class="sizeCenter"><div class="size size6"></div></div></div>
              <div class="brushSize" data-size="6"><div class="sizeCenter"><div class="size size16"></div></div></div>
              <div class="brushSize" data-size="14"><div class="sizeCenter"><div class="size size30"></div></div></div>
              <div class="brushSize" data-size="28"><div class="sizeCenter"><div class="size size44"></div></div></div>
            </div>

            <div class="containerClearCanvas">
              <div id="buttonClearCanvas" title="Очистить"><img class="toolIcon" src="eraser.gif" alt=""></div>
            </div>
          </div>
        </div>

        <!-- Чат справа -->
        <div id="containerSidebar">
          <div id="containerChat">
            <div id="boxMessages">
              <div class="chat-row system">Добро пожаловать в игру! Введите догадку в чат.</div>
            </div>
            <div id="boxChatInput">
              <form id="formChat" class="chat-input-row" action="javascript:void(0);">
                <input class="form-control" id="inputChat" autocomplete="off" type="text" placeholder="Ваш вариант...">
              </form>
            </div>
          </div>
        </div>

      </div>
    </div>

  </div>

  <script src="words.js"></script>
  <script src="game-engine.js"></script>
</body>
</html>
