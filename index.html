<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>skribbl.io - Free Multiplayer Drawing &amp; Guessing Game</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="stylesheet" type="text/css" href="css/style.css">
  <!-- MQTT via WebSocket: 100% стабильная связь без серверов, без засыпаний и без блокировок -->
  <script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
  <style>
    /* Отключение рекламы */
    .ad-1, .ad-2, .ad-side, #preroll, .button-create, #custom-invite-bar { display: none !important; }

    /* Железобетонный контейнер и спрайты аватара */
    .avatar-customizer .container {
      width: 96px !important;
      height: 96px !important;
      position: relative !important;
      display: flex !important;
      align-items: center !important;
      justify-content: center !important;
    }
    .skribbl-avatar-box {
      width: 96px;
      height: 96px;
      position: relative;
    }
    .skribbl-avatar-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 96px;
      height: 96px;
      background-size: 960px 960px; /* 10 колонок по 96px */
      background-repeat: no-repeat;
      image-rendering: pixelated;
    }

    /* Модалка выбора слова */
    #custom-word-picker {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    #custom-word-picker .box {
      background: white;
      padding: 24px 36px;
      border-radius: 8px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    #custom-word-picker h2 {
      font-size: 22px;
      margin-bottom: 16px;
      color: #333;
    }
    .word-btns {
      display: flex;
      gap: 12px;
    }
    .word-btn {
      background: #53759e;
      color: white;
      font-size: 18px;
      font-weight: bold;
      border: none;
      padding: 12px 24px;
      border-radius: 6px;
      cursor: pointer;
    }
    .word-btn:hover { background: #3b5575; }

    .hidden { display: none !important; }

    /* Палитра и размеры */
    .color-swatch {
      width: 22px;
      height: 22px;
      border-radius: 2px;
      cursor: pointer;
      border: 1px solid rgba(0,0,0,0.2);
    }
    .color-swatch.active { outline: 2px solid #000; outline-offset: 1px; }

    .size-dot-btn {
      width: 28px;
      height: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      background: white;
      border: 1px solid #ccc;
      border-radius: 3px;
    }
    .size-dot-btn.active { border-color: #53759e; background: #eef2f7; }
    .size-dot-btn span { background: #333; border-radius: 50%; display: block; }

    .btn-flat {
      cursor: pointer;
      font-weight: bold;
      border: none;
      border-radius: 3px;
      padding: 8px 14px;
      color: white;
      background: #53759e;
    }
    .btn-flat:hover { background: #3c577a; }

    /* Чат стили */
    .chat-msg {
      padding: 4px 6px;
      border-radius: 4px;
      word-break: break-word;
    }
    .chat-msg.system { color: #666; font-style: italic; }
    .chat-msg.correct { color: #16a34a; font-weight: bold; background: #dcfce7; }
  </style>
</head>
<body translate="no">

  <!-- ГЛАВНОЕ МЕНЮ (ОРИГИНАЛ) -->
  <div id="home">
    <div class="logo-big">
      <a href="javascript:void(0)"><img src="img/logo.gif" alt="skribbl.io"></a>
      <div class="avatar-container"></div>
    </div>

    <div class="panels">
      <div class="panel-left"></div>

      <div class="panel">
        <div class="container-name-lang">
          <input class="input-name" id="input-username" type="text" placeholder="Enter your name" maxlength="16" autocomplete="off">
        </div>

        <!-- АВАТАР КАСТОМАЙЗЕР -->
        <div class="avatar-customizer">
          <div class="arrows left">
            <div class="arrow left" data-avatar-index="1"></div>
            <div class="arrow left" data-avatar-index="2"></div>
            <div class="arrow left" data-avatar-index="0"></div>
          </div>
          <div class="container" id="customizer-avatar-container">
            <div class="skribbl-avatar-box">
              <div class="skribbl-avatar-layer" id="avatar-layer-color"></div>
              <div class="skribbl-avatar-layer" id="avatar-layer-eyes"></div>
              <div class="skribbl-avatar-layer" id="avatar-layer-mouth"></div>
            </div>
          </div>
          <div class="arrows right">
            <div class="arrow right" data-avatar-index="1"></div>
            <div class="arrow right" data-avatar-index="2"></div>
            <div class="arrow right" data-avatar-index="0"></div>
          </div>
          <div class="randomize" id="btn-randomize-avatar" title="Randomize Avatar"></div>
        </div>

        <button class="button-play" id="btn-play-action">
          <span data-translate="text">Play!</span>
        </button>
      </div>

      <div class="panel-right"></div>
    </div>
  </div>

  <!-- ИГРОВОЙ ЭКРАН -->
  <div id="game" style="display:none">
    <div id="game-wrapper">
      
      <div id="game-logo">
        <a href="javascript:void(0)"><img src="img/logo.gif" alt="skribbl.io"></a>
      </div>

      <div id="game-bar">
        <div id="game-settings" style="cursor:default;">
          <div class="icon"></div>
        </div>
        <div id="game-clock">
          <div class="text" id="game-timer-display">60</div>
        </div>
        <div id="game-round">
          <div class="text" id="game-round-display">Round 1 of 3</div>
        </div>
        <div id="game-word">
          <div class="description" id="game-word-label">WAITING...</div>
          <div class="word" id="game-word-current">_ _ _ _</div>
          <div class="hints"><div class="container"></div></div>
        </div>
      </div>

      <div id="game-players">
        <div class="players-list" id="game-players-list"></div>
      </div>

      <div id="game-players-footer"></div>

      <div id="game-canvas">
        <canvas id="main-draw-canvas" width="800" height="600"></canvas>
        <div class="overlay" id="canvas-overlay" style="display:none;"></div>
        
        <!-- Выбор слова (только для рисующего) -->
        <div id="custom-word-picker" class="hidden">
          <div class="box">
            <h2>Choose a word to draw:</h2>
            <div class="word-btns" id="word-picker-options"></div>
          </div>
        </div>
      </div>

      <!-- Тулбар (Отображается ТОЛЬКО рисующему!) -->
      <div id="game-toolbar" style="display:none;">
        <div class="toolbar-group-tools" style="display:flex; gap:6px; align-items:center;">
          <button id="btn-tool-pen" class="btn-flat" style="padding:6px 10px; font-size:12px;">✏️ Pen</button>
          <button id="btn-tool-eraser" class="btn-flat" style="padding:6px 10px; font-size:12px; background:#78909c;">🧹 Eraser</button>
          <button id="btn-tool-clear" class="btn-flat" style="padding:6px 10px; font-size:12px; background:#e53935;">🗑 Clear</button>
        </div>

        <div class="sizes" style="display:flex; gap:4px; align-items:center; margin: 0 10px;">
          <div class="size-dot-btn active" data-size="3"><span style="width:4px; height:4px;"></span></div>
          <div class="size-dot-btn" data-size="6"><span style="width:8px; height:8px;"></span></div>
          <div class="size-dot-btn" data-size="12"><span style="width:14px; height:14px;"></span></div>
          <div class="size-dot-btn" data-size="24"><span style="width:20px; height:20px;"></span></div>
        </div>

        <div class="colors" style="display:flex; gap:4px; align-items:center;">
          <div class="color-swatch active" data-color="#000000" style="background:#000000;"></div>
          <div class="color-swatch" data-color="#ffffff" style="background:#ffffff;"></div>
          <div class="color-swatch" data-color="#c1c1c1" style="background:#c1c1c1;"></div>
          <div class="color-swatch" data-color="#ef130b" style="background:#ef130b;"></div>
          <div class="color-swatch" data-color="#ff7100" style="background:#ff7100;"></div>
          <div class="color-swatch" data-color="#ffe400" style="background:#ffe400;"></div>
          <div class="color-swatch" data-color="#00cc00" style="background:#00cc00;"></div>
          <div class="color-swatch" data-color="#00b2ff" style="background:#00b2ff;"></div>
          <div class="color-swatch" data-color="#231fd3" style="background:#231fd3;"></div>
          <div class="color-swatch" data-color="#a300ba" style="background:#a300ba;"></div>
          <div class="color-swatch" data-color="#d37caa" style="background:#d37caa;"></div>
          <div class="color-swatch" data-color="#a0522d" style="background:#a0522d;"></div>
        </div>
      </div>

      <!-- Чат -->
      <div id="game-chat">
        <div class="chat-content" id="skribbl-chat-messages" style="display:flex; flex-direction:column; gap:4px; padding:10px; overflow-y:auto; flex:1; font-size:13px;">
          <div class="chat-msg system">Добро пожаловать в игру!</div>
        </div>
        <form class="chat-form" id="skribbl-chat-form">
          <input type="text" id="skribbl-chat-input" placeholder="Введите ваш вариант..." maxlength="100" autocomplete="off">
        </form>
      </div>

    </div>
  </div>

  <script src="words.js"></script>
  <script src="app.js"></script>
</body>
</html>
