<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skribbl Friends - Рисуй и Угадывай</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
</head>
<body>

  <!-- Экран входа в лобби -->
  <div id="login-screen" class="overlay-modal">
    <div class="card login-card">
      <div class="logo">
        <span class="logo-sketch">✏️</span>
        <h1>Skribbl Friends</h1>
      </div>
      <p class="subtitle">Играй и рисуй с друзьями прямо в браузере</p>
      
      <div class="form-group">
        <label for="username-input">Твой никнейм:</label>
        <input type="text" id="username-input" placeholder="Введите имя..." maxlength="15" autocomplete="off">
      </div>

      <div class="avatar-selection">
        <label>Выбери аватарку:</label>
        <div class="avatars" id="avatars-container"></div>
      </div>

      <div class="actions">
        <button id="btn-create-room" class="btn btn-primary">➕ Создать комнату</button>
        <div class="divider"><span>или</span></div>
        <div class="join-box">
          <input type="text" id="room-code-input" placeholder="Код комнаты..." autocomplete="off">
          <button id="btn-join-room" class="btn btn-secondary">Войти по коду</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Модальное окно выбора слова (для рисующего) -->
  <div id="word-picker-modal" class="overlay-modal hidden">
    <div class="card word-picker-card">
      <h2>Твоя очередь рисовать!</h2>
      <p>Выбери одно слово:</p>
      <div class="words-container" id="word-choices"></div>
    </div>
  </div>

  <!-- Основной экран игры -->
  <div id="game-screen" class="hidden">
    <header class="game-header">
      <div class="header-left">
        <span class="game-logo">✏️ Skribbl</span>
        <div class="room-pill">
          Комната: <strong id="current-room-code">...</strong>
          <button id="btn-copy-invite" title="Скопировать ссылку для друзей">📋 Пригласить</button>
        </div>
      </div>

      <div class="header-center">
        <div class="timer-badge" id="timer-badge">
          ⏳ <span id="timer-display">60</span>s
        </div>
        <div class="word-mask-badge" id="word-mask-badge">
          <span id="word-mask-display">Ожидание...</span>
        </div>
      </div>

      <div class="header-right">
        <button id="btn-start-game" class="btn btn-sm btn-primary hidden">▶ Начать игру</button>
        <span id="round-badge" class="round-badge">Раунд 1/3</span>
      </div>
    </header>

    <main class="game-layout">
      <!-- Список игроков слева -->
      <aside class="players-sidebar">
        <h3>Игроки (<span id="players-count">0</span>)</h3>
        <div id="players-list" class="players-list"></div>
      </aside>

      <!-- Холст и инструменты по центру -->
      <section class="canvas-section">
        <div class="canvas-container">
          <canvas id="drawing-canvas" width="800" height="600"></canvas>
          <div id="canvas-overlay-text" class="canvas-overlay-text hidden"></div>
        </div>

        <!-- Панель инструментов (только для рисующего) -->
        <div class="toolbar" id="toolbar">
          <div class="palette" id="palette">
            <button class="color-btn active" style="background: #000000;" data-color="#000000"></button>
            <button class="color-btn" style="background: #ffffff; border: 1px solid #ccc;" data-color="#ffffff"></button>
            <button class="color-btn" style="background: #e74c3c;" data-color="#e74c3c"></button>
            <button class="color-btn" style="background: #e67e22;" data-color="#e67e22"></button>
            <button class="color-btn" style="background: #f1c40f;" data-color="#f1c40f"></button>
            <button class="color-btn" style="background: #2ecc71;" data-color="#2ecc71"></button>
            <button class="color-btn" style="background: #1abc9c;" data-color="#1abc9c"></button>
            <button class="color-btn" style="background: #3498db;" data-color="#3498db"></button>
            <button class="color-btn" style="background: #9b59b6;" data-color="#9b59b6"></button>
            <button class="color-btn" style="background: #795548;" data-color="#795548"></button>
          </div>

          <div class="brush-sizes" id="brush-sizes">
            <button class="size-btn active" data-size="3"><span style="width: 6px; height: 6px;"></span></button>
            <button class="size-btn" data-size="6"><span style="width: 10px; height: 10px;"></span></button>
            <button class="size-btn" data-size="12"><span style="width: 16px; height: 16px;"></span></button>
            <button class="size-btn" data-size="24"><span style="width: 22px; height: 22px;"></span></button>
          </div>

          <div class="tool-actions">
            <button id="btn-eraser" class="tool-btn" title="Ластик">🧹 Ластик</button>
            <button id="btn-clear-canvas" class="tool-btn danger" title="Очистить холст">🗑 Очистить</button>
          </div>
        </div>
      </section>

      <!-- Чат и угадывание справа -->
      <aside class="chat-sidebar">
        <div class="chat-messages" id="chat-messages">
          <div class="chat-msg system">Добро пожаловать в Skribbl Friends! Отправьте ссылку друзьям.</div>
        </div>
        <form id="chat-form" class="chat-form">
          <input type="text" id="chat-input" placeholder="Напишите ответ или сообщение..." autocomplete="off">
          <button type="submit" class="btn btn-sm btn-primary">Отправить</button>
        </form>
      </aside>
    </main>
  </div>

  <script src="words.js"></script>
  <script src="app.js"></script>
</body>
</html>
